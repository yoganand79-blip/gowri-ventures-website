<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gowri Ventures</title>
    <style>
      :root { --ink: #241d1b; --plum: #4e1f33; --gold: #c99b43; --cream: #fbf8f2; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); font-family: Arial, sans-serif; background: var(--cream); }
      .contact { padding: 80px 24px; background: var(--plum); color: #fff; }
      .contact__inner { width: min(100%, 1080px); margin: auto; }
      .eyebrow { margin: 0 0 12px; color: var(--gold); font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 560px; margin: 0; font-family: Georgia, serif; font-size: clamp(2.25rem, 5vw, 4rem); font-weight: 400; line-height: 1.08; }
      .intro { max-width: 560px; margin: 20px 0 42px; color: #f1e8e7; font-size: 1.06rem; line-height: 1.6; }
      .contact__cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .contact-card { display: block; min-height: 164px; padding: 27px; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; color: inherit; text-decoration: none; transition: background-color .2s ease, transform .2s ease; }
      .contact-card:hover, .contact-card:focus-visible { background: rgba(255,255,255,.1); outline: 2px solid var(--gold); outline-offset: 3px; transform: translateY(-2px); }
      .contact-card__label { display: block; margin-bottom: 24px; color: var(--gold); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .contact-card__value { font-family: Georgia, serif; font-size: clamp(1.4rem, 3vw, 2rem); overflow-wrap: anywhere; }
      .contact-card__hint { display: block; margin-top: 12px; color: #f1e8e7; font-size: .9rem; }
      @media (max-width: 640px) { .contact { padding-block: 60px; } .contact__cards { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <section class="contact" id="contact" aria-labelledby="contact-title">
        <div class="contact__inner">
          <p class="eyebrow">Contact</p>
          <h1 id="contact-title">Let’s start a conversation.</h1>
          <p class="intro">Reach out to Gowri Ventures by phone or email. We look forward to hearing from you.</p>
          <div class="contact__cards">
            <a class="contact-card" href="tel:8095837627" aria-label="Call Gowri Ventures at 8095837627">
              <span class="contact-card__label">Phone</span>
              <span class="contact-card__value">8095837627</span>
              <span class="contact-card__hint">Tap to call</span>
            </a>
            <a class="contact-card" href="mailto:gowriventures4@gmail.com" aria-label="Email Gowri Ventures at gowriventures4@gmail.com">
              <span class="contact-card__label">Email</span>
              <span class="contact-card__value">gowriventures4@gmail.com</span>
              <span class="contact-card__hint">Send us an email</span>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
